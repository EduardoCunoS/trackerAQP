<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L12,6 L0,12 z" fill="#333"/>
</marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.18"/>
</filter>
</defs>
<rect x="0" y="0" width="1200" height="650" fill="#f7f9fc"/>
<text x="600" y="45" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2937">Diagrama de estados — Búsqueda de rutas</text>
<text x="600" y="78" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#4b5563">Ciclo de una solicitud: espera, búsqueda, resultado o solicitud inválida</text>
<g filter="url(#shadow)"><rect x="65.0" y="278.0" width="170" height="64" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="150" y="317" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">inicio</text></g>
<g filter="url(#shadow)"><rect x="375.0" y="278.0" width="170" height="64" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="460" y="317" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">buscando</text></g>
<g filter="url(#shadow)"><rect x="765.0" y="158.0" width="170" height="64" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="850" y="197" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">con_ruta</text></g>
<g filter="url(#shadow)"><rect x="765.0" y="398.0" width="170" height="64" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/><text x="850" y="437" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">sin_ruta</text></g>
<g filter="url(#shadow)"><rect x="375.0" y="508.0" width="260" height="64" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/><text x="505" y="547" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">solicitud_invalida</text></g>
<path d="M235,310 L370,310" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/><text x="302" y="295" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#374151">solicitud = valida</text>
<path d="M120,342 C120,470 260,540 370,540" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/><text x="180" y="470" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#374151">solicitud = invalida</text>
<path d="M545,295 C620,260 690,220 760,200" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/><text x="610" y="235" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#374151">rutas_encontradas &amp;gt; 0</text>
<path d="M545,325 C620,360 690,400 760,420" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/><text x="610" y="395" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#374151">rutas_encontradas = 0</text>
<path d="M850,158 C760,55 300,60 150,278" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/><text x="500" y="70" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#374151">resultado</text>
<path d="M850,462 C760,590 300,590 150,342" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/><text x="500" y="610" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#374151">resultado</text>
<path d="M505,508 C505,430 300,380 150,342" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/><text x="300" y="410" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#374151">reinicio</text>
<text x="600" y="642" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#6b7280">Los estados con_ruta, sin_ruta y solicitud_invalida son transitorios: vuelven a inicio.</text>
</svg>